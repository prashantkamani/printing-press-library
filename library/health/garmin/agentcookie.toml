# agentcookie.toml: secrets-bus adoption manifest v2
# See docs/spec-agentcookie-secrets-bus-v2-adoption.md
schema_version = 2
name = "garmin-pp-cli"
display_name = "Garmin Connect"
description = "Your whole Garmin history in a local database, not one 28-day page at a time."
project_kind = "cli"

[secrets.file]
path = "~/.config/garmin-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
GARMIN_ACCESS_TOKEN = true
GARMIN_TOKEN = true
